services:
  web:
    image: nginx:alpine
    container_name: fitlife_web
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: always

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitlife_app
    # Remover o ports "3000:3000" para evitar conflito. A API fica privada na rede Docker.
    volumes:
      - db-data:/app/data
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-development}
      - JWT_SECRET=${JWT_SECRET:-fitlife_sync_super_secret_key_123}
      - DB_PATH=${DB_PATH:-/app/data/database.sqlite}
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fitlife_tunnel
    restart: always
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - web

volumes:
  db-data:
