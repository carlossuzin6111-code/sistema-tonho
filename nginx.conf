worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Cloudflare Tunnel supplies one canonical visitor address. Direct local
    # requests fall back to their socket address. The public port is bound to
    # loopback in Compose, so remote clients cannot forge this header directly.
    map $http_cf_connecting_ip $forwarded_client_ip {
        default $http_cf_connecting_ip;
        "" $remote_addr;
    }

    server {
        listen 3000;
        server_name localhost;
        # Re-resolve the Compose service name after app restarts/redeploys.
        # Without this, Nginx keeps a stale container IP and returns 502.
        resolver 127.0.0.11 valid=10s;
        set $backend_app http://app:3000;
        client_max_body_size 600k;

        # The backend keeps its own defensive headers for direct internal
        # access. Hide overlapping upstream values at the public boundary so
        # clients receive exactly one unambiguous policy from Nginx.
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;

        # Security headers for the static frontend and proxied API responses.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Inline styles remain for the legacy layout, while executable scripts
        # are restricted to files served by this application.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: https://raw.githubusercontent.com; connect-src 'self'" always;

        # Serve Frontend Static Files
        root /usr/share/nginx/html;
        index desktop.html; # O router javascript lida com isso se entrarmos em /

        # Redirecionamento da raiz pro router index.html
        location = / {
            try_files /index.html =404;
        }

        # HTML is the cache manifest for the application and must be
        # revalidated so new asset versions are discovered immediately.
        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        # Service Worker must revalidate so updates are detected immediately
        location = /sw.js {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
            try_files $uri =404;
        }

        # PWA Web Manifest location and content type
        location = /manifest.webmanifest {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header Content-Type "application/manifest+json; charset=utf-8" always;
            try_files $uri =404;
        }

        # CSS/JS filenames carry a release query string. They can therefore
        # be cached immutably without serving stale code after a release.
        # The query string is changed by each frontend release.
        location ~* \.(?:css|js)$ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Demais arquivos estáticos
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Stream SSE com timeout maior que o heartbeat de 25 segundos enviado
        # pelo backend. A rota exata evita alterar timeouts das demais APIs.
        location = /api/chat/stream {
            proxy_pass $backend_app$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $forwarded_client_ip;
            proxy_set_header X-Forwarded-For $forwarded_client_ip;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            proxy_read_timeout 75s;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }

        # Expose the liveness/readiness probes through the same public boundary
        # used by Compose and the tunnel.
        location ^~ /health/ {
            proxy_pass $backend_app$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $forwarded_client_ip;
            proxy_set_header X-Forwarded-For $forwarded_client_ip;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            proxy_buffering off;
        }

        # Proxy Reverso para as demais rotas da API (Node.js)
        location /api/ {
            proxy_pass $backend_app$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $forwarded_client_ip;
            proxy_set_header X-Forwarded-For $forwarded_client_ip;
            
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
