services:
  web:
    image: nginx:alpine
    container_name: fitlife_web
    ports:
      # Public traffic enters through the outbound-only Cloudflare Tunnel.
      # Keep host access local so visitor-IP headers cannot be forged remotely.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitlife_app
    # Remover o ports "3000:3000" para evitar conflito. A API fica privada na rede Docker.
    volumes:
      - db-data:/app/data
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - DB_PATH=${DB_PATH:-/app/data/database.sqlite}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  translation-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitlife_translation_worker
    command: npm run worker:translate
    volumes:
      - db-data:/app/data
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_PATH=${DB_PATH:-/app/data/database.sqlite}
      - TRANSLATION_POLL_INTERVAL_MS=${TRANSLATION_POLL_INTERVAL_MS:-15000}
      - TRANSLATION_WORK_INTERVAL_MS=${TRANSLATION_WORK_INTERVAL_MS:-800}
      - TRANSLATION_RETRY_DELAY_MS=${TRANSLATION_RETRY_DELAY_MS:-5000}
      - TRANSLATION_CLAIM_TIMEOUT_MS=${TRANSLATION_CLAIM_TIMEOUT_MS:-300000}
    depends_on:
      app:
        condition: service_healthy
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fitlife_tunnel
    restart: always
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      web:
        condition: service_healthy

volumes:
  db-data:
