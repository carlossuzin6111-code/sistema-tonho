worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Cloudflare Tunnel supplies one canonical visitor address. Direct local
    # requests fall back to their socket address. The public port is bound to
    # loopback in Compose, so remote clients cannot forge this header directly.
    map $http_cf_connecting_ip $forwarded_client_ip {
        default $http_cf_connecting_ip;
        "" $remote_addr;
    }

    server {
        listen 3000;
        server_name localhost;
        client_max_body_size 100k;

        # Security headers for the static frontend and proxied API responses.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Inline styles remain for the legacy layout, but executable scripts are
        # restricted to local files and the Lucide CDN used by both interfaces.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'" always;

        # Serve Frontend Static Files
        root /usr/share/nginx/html;
        index desktop.html; # O router javascript lida com isso se entrarmos em /

        # Redirecionamento da raiz pro router index.html
        location = / {
            try_files /index.html =404;
        }

        # Demais arquivos estáticos
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Stream SSE com timeout maior que o heartbeat de 25 segundos enviado
        # pelo backend. A rota exata evita alterar timeouts das demais APIs.
        location = /api/chat/stream {
            proxy_pass http://app:3000/api/chat/stream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $forwarded_client_ip;
            proxy_set_header X-Forwarded-For $forwarded_client_ip;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            proxy_read_timeout 75s;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }

        # Proxy Reverso para as demais rotas da API (Node.js)
        location /api/ {
            proxy_pass http://app:3000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $forwarded_client_ip;
            proxy_set_header X-Forwarded-For $forwarded_client_ip;
            
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
