name: Test suites

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-policy:
    name: CI policy
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate mandatory workflow policy
        run: bash .github/scripts/verify-ci-policy.sh

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Scan current source with Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: dir /github/workspace --redact --exit-code 1 --no-banner

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-bytes

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate database migrations
        run: npm run migrate:status

      - name: Audit backend production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run backend tests
        run: npm test

  frontend:
    name: Frontend and infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Run frontend and infrastructure tests
        run: npm test
