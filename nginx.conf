worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;

    server {
        listen 3000;
        server_name localhost;
        client_max_body_size 100k;

        # Security headers for the static frontend and proxied API responses.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # Inline allowances remain temporarily because the legacy HTML still
        # contains inline handlers/styles. All other resource origins are closed.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'" always;

        # Serve Frontend Static Files
        root /usr/share/nginx/html;
        index desktop.html; # O router javascript lida com isso se entrarmos em /

        # Redirecionamento da raiz pro router index.html
        location = / {
            try_files /index.html =404;
        }

        # Demais arquivos estáticos
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy Reverso para a API (Node.js)
        location /api/ {
            proxy_pass http://app:3000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Suporte a Server-Sent Events (Chat Stream)
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
