services:
  web:
    image: nginx:alpine@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
    container_name: fitlife_web
    ports:
      # Public traffic enters through the outbound-only Cloudflare Tunnel.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitlife_app
    # Remover o ports "3000:3000" para evitar conflito. A API fica privada na rede Docker.
    volumes:
      - db-data:/app/data
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - DB_PATH=${DB_PATH:-/app/data/database.sqlite}
      - API_DOCS_ENABLED=${API_DOCS_ENABLED:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  translation-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitlife_translation_worker
    command: npm run worker:translate
    volumes:
      - db-data:/app/data
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_PATH=${DB_PATH:-/app/data/database.sqlite}
      - TRANSLATION_POLL_INTERVAL_MS=${TRANSLATION_POLL_INTERVAL_MS:-15000}
      - TRANSLATION_WORK_INTERVAL_MS=${TRANSLATION_WORK_INTERVAL_MS:-800}
      - TRANSLATION_RETRY_DELAY_MS=${TRANSLATION_RETRY_DELAY_MS:-5000}
      - TRANSLATION_CLAIM_TIMEOUT_MS=${TRANSLATION_CLAIM_TIMEOUT_MS:-300000}
    depends_on:
      app:
        condition: service_healthy
    restart: always

  backup-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitlife_backup_worker
    command: npm run worker:backup
    volumes:
      - db-data:/app/data
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_PATH=${DB_PATH:-/app/data/database.sqlite}
      - BACKUP_INTERVAL_MS=${BACKUP_INTERVAL_MS:-86400000}
      - BACKUP_RETENTION=${BACKUP_RETENTION:-7}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET:-}
      - BACKUP_S3_PREFIX=${BACKUP_S3_PREFIX:-fitlife/backups}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION:-auto}
      - BACKUP_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}
      - BACKUP_S3_FORCE_PATH_STYLE=${BACKUP_S3_FORCE_PATH_STYLE:-false}
      - BACKUP_S3_ACCESS_KEY_ID=${BACKUP_S3_ACCESS_KEY_ID:-}
      - BACKUP_S3_SECRET_ACCESS_KEY=${BACKUP_S3_SECRET_ACCESS_KEY:-}
      - BACKUP_ENCRYPTION_KEY=${BACKUP_ENCRYPTION_KEY:-}
      - BACKUP_ENCRYPTION_KEY_VERSION=${BACKUP_ENCRYPTION_KEY_VERSION:-1}
    depends_on:
      app:
        condition: service_healthy
    restart: always

  notification-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fitlife_notification_worker
    command: npm run worker:notifications
    volumes:
      - db-data:/app/data
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_PATH=${DB_PATH:-/app/data/database.sqlite}
      - NOTIFICATION_POLL_INTERVAL_MS=${NOTIFICATION_POLL_INTERVAL_MS:-5000}
      - NOTIFICATION_MAX_ATTEMPTS=${NOTIFICATION_MAX_ATTEMPTS:-5}
      - NOTIFICATION_RETENTION_DAYS=${NOTIFICATION_RETENTION_DAYS:-90}
    depends_on:
      app:
        condition: service_healthy
    restart: always

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest@sha256:4f6655284ab3d252b7f28fedb19fe6c8fc82ee5b1295c20ac74d475e5398a52d
    container_name: fitlife_tunnel
    restart: always
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      web:
        condition: service_healthy

volumes:
  db-data:
